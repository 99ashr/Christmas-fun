<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Secret Santa — Reveal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg1: #071425;
            --bg2: #0f2b3a;
            --card: #07343f;
            --accent: #ff7bac;
            --muted: rgba(255, 255, 255, 0.9)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', system-ui, Arial;
            color: var(--muted);
            background: linear-gradient(180deg, var(--bg1), var(--bg2));
            -webkit-font-smoothing: antialiased
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px
        }

        .card {
            width: 100%;
            max-width: 720px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 12px 40px rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin: 0 0 8px;
            color: #fff
        }

        p.lead {
            margin: 0 0 18px;
            color: rgba(255, 255, 255, 0.9)
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        input[type=text] {
            flex: 1;
            min-width: 160px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            transition: all 200ms ease;
        }

        input[type=text]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input[type=text]:focus {
            outline: none;
            border-color: #ff8fb3;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(255, 143, 179, 0.3);
        }

        input[type=text]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button.btn {
            background: linear-gradient(90deg, #ff8fb3, #ff6a9a);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700
        }

        .note {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 12px
        }

        .reveal-area {
            margin-top: 20px;
            min-height: 96px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .gift {
            width: 220px;
            height: 220px;
            border-radius: 14px;
            background: linear-gradient(180deg, #ffffff08, #00000006);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            cursor: pointer
        }

        .gift .bow {
            width: 90%;
            height: 28px;
            background: linear-gradient(90deg, var(--accent), #ff6a8a);
            border-radius: 8px;
            margin-bottom: 12px;
            transform: translateY(-20px)
        }

        .gift .tag {
            font-size: 16px;
            color: #fff;
            font-weight: 700
        }

        .recipient {
            display: none;
            margin-top: 18px;
            text-align: center
        }

        .recipient .name {
            font-size: 20px;
            font-weight: 700;
            color: #fff
        }

        /* confetti */
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 16px;
            opacity: 0;
            pointer-events: none;
            transform-origin: center
        }

        /* tiny snow background */
        .snow {
            position: absolute;
            inset: 0;
            z-index: 0;
            opacity: 0.5;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><circle cx="10" cy="10" r="1.4" fill="rgba(255,255,255,0.9)"/><circle cx="40" cy="60" r="0.9" fill="rgba(255,255,255,0.8)"/><circle cx="90" cy="30" r="1.2" fill="rgba(255,255,255,0.85)"/></svg>');
            background-size: 120px 120px
        }

        .help {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 14px
        }

        @media (max-width:520px) {
            .gift {
                width: 160px;
                height: 160px
            }

            .card {
                padding: 18px
            }

            .input-row {
                flex-direction: column;
                align-items: stretch
            }

            button.btn {
                width: 100%
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card" role="main">
            <div class="snow" aria-hidden="true"></div>
            <h1>Secret Santa — Reveal Your Recipient</h1>
            <p class="lead">Have a token? Enter it below. Tap the gift to unwrap and reveal your assigned recipient —
                shh, it's a surprise!</p>

            <div class="input-row">
                <input id="tokenInput" type="text" placeholder="Enter your token" aria-label="Secret Santa token" />
                <button id="revealBtn" class="btn">Unlock</button>
            </div>
            <div class="help">If you don't have a token, contact your organizer. This page doesn't show admin controls
                or tokens.</div>

            <div class="reveal-area" id="revealArea">
                <div id="gift" class="gift" title="Click to unwrap">
                    <div class="bow" aria-hidden="true"></div>
                    <div class="tag">Tap to unwrap</div>
                </div>
            </div>

            <div class="recipient" id="recipientCard">
                <div style="font-size:13px;color:rgba(255,255,255,0.8)">Ho ho ho — your recipient is</div>
                <div class="name" id="recipientName">—</div>
            </div>

        </div>
    </div>

    <script>
        const STORAGE_KEY = 'secret_santa_mapping_v1';
        function loadMapping() { try { const v = localStorage.getItem(STORAGE_KEY); return v ? JSON.parse(v) : null } catch (e) { return null } }

        function showMessage(text, timeout = 3000) { const area = document.getElementById('revealArea'); let el = area.querySelector('.msg'); if (!el) { el = document.createElement('div'); el.className = 'msg'; el.style.color = 'rgba(255,255,255,0.9)'; el.style.textAlign = 'center'; el.style.marginTop = '8px'; area.appendChild(el); } el.textContent = text; if (timeout > 0) setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el) }, timeout); }

        function makeConfetti(x, y) {
            const colors = ['#FF6B6B', '#FFD166', '#6BCB77', '#4D96FF', '#FF9F1C', '#D157A0']; const count = 18; const area = document.querySelector('.card'); for (let i = 0; i < count; i++) { const el = document.createElement('div'); el.className = 'confetti-piece'; el.style.background = colors[Math.floor(Math.random() * colors.length)]; el.style.left = (x + (Math.random() * 60 - 30)) + 'px'; el.style.top = (y + (Math.random() * 20 - 10)) + 'px'; el.style.transform = `rotate(${Math.random() * 360}deg)`; el.style.opacity = '1'; el.style.borderRadius = '2px'; el.style.transition = 'transform 900ms cubic-bezier(.17,.67,.83,.67), opacity 900ms ease'; area.appendChild(el); (function (e) { requestAnimationFrame(() => { e.style.transform = `translateY(${- (100 + Math.random() * 240)}px) translateX(${(Math.random() * 240 - 120)}px) rotate(${Math.random() * 720 - 360}deg) scale(${1 + Math.random() * 0.6})`; e.style.opacity = '0'; }); setTimeout(() => { if (e.parentNode) e.parentNode.removeChild(e); }, 1000); })(el); }
        }

        function revealRecipient(token) {
            const data = loadMapping(); const recipientCard = document.getElementById('recipientCard'); const nameEl = document.getElementById('recipientName'); if (!data || !data.tokenMap) { showMessage('No draw available in this browser. Contact the organizer to get a token.'); return null; } const recipient = data.tokenMap[token]; if (!recipient) { showMessage('Invalid token. Please check and try again.'); return null; } // success
            nameEl.textContent = recipient; recipientCard.style.display = 'block'; // animate confetti from center of gift
            const gift = document.getElementById('gift'); const rect = gift.getBoundingClientRect(); const x = rect.left + rect.width / 2; const y = rect.top + rect.height / 3; makeConfetti(x, y);
            // lock input and button
            document.getElementById('tokenInput').disabled = true; document.getElementById('revealBtn').disabled = true; gift.classList.add('unwrapped');
            return recipient;
        }

        // gift click/interaction
        const gift = document.getElementById('gift'); gift.addEventListener('click', () => {
            const tok = document.getElementById('tokenInput').value.trim().toUpperCase(); if (!tok) { showMessage('Please enter your token first.'); return; } // small unwrap animation
            gift.style.transition = 'transform 350ms ease'; gift.style.transform = 'scale(0.98) rotate(-2deg)'; setTimeout(() => { gift.style.transform = ''; revealRecipient(tok); }, 200);
        });

        document.getElementById('revealBtn').addEventListener('click', () => { gift.click(); });

        // allow pressing Enter in input
        document.getElementById('tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('revealBtn').click(); } });

        // tiny accessibility: focus token input on load
        window.addEventListener('load', () => { document.getElementById('tokenInput').focus(); });
    </script>
</body>

</html>
